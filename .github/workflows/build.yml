name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Verify Java and Gradle toolchain
      run: |
        java -version
        ./gradlew --version

    - name: Run lint
      run: ./gradlew :app:lintDebug --no-daemon --stacktrace

    - name: Run JVM unit tests
      if: always()
      run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

    - name: Build debug and release artifacts
      if: always()
      run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

    - name: Analyze release shrinker configuration
      if: always()
      run: ./gradlew :app:analyzeReleaseR8Config --no-daemon --stacktrace

    - name: Verify Room migration schemas are generated
      if: always()
      run: test -n "$(find app/schemas -type f -name '*.json' -print -quit)"

    - name: Upload verification reports and APKs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: verification-${{ github.run_attempt }}
        path: |
          app/build/reports/
          app/build/test-results/
          app/build/outputs/apk/
          app/build/outputs/mapping/
          app/schemas/
        if-no-files-found: ignore
        retention-days: 14

  instrumented:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [26, 35]

    steps:
    - uses: actions/checkout@v5

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Compose UI tests on API ${{ matrix.api-level }}
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: default
        arch: x86_64
        profile: pixel_2
        disable-animations: true
        pre-emulator-launch-script: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon --console=plain
        script: ./gradlew connectedDebugAndroidTest --no-daemon --console=plain

    - name: Upload instrumented test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: instrumented-api-${{ matrix.api-level }}-${{ github.run_attempt }}
        path: |
          app/build/reports/androidTests/
          app/build/outputs/androidTest-results/
          app/build/outputs/apk/
        if-no-files-found: ignore
        retention-days: 14
